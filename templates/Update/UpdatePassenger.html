{% extends 'base.html' %}
{% block title %}SkyDesk - Update Passenger{% endblock %}
{% block content %}
    <h1>Update Passenger Details</h1>
    <div>
        <form action="{{ url_for('Passengers.Update_Passenger', id=Passenger.Passenger_ID) }}" method="POST">
            <label>First Name</label>
            <input type="text" name="First_Name" value="{{ Passenger.First_Name }}" required><br>

            <label>Last Name</label>
            <input type="text" name="Last_Name" value="{{ Passenger.Last_Name }}" required><br>

            <label>Passport No.</label>
            <input type="text" name="Passport_Number" value="{{ Passenger.Passport_Number }}" required><br>

            <label>Nationality</label>
            <input type="text" name="Nationality" value="{{ Passenger.Nationality }}" required><br>

            <label>Contact Number</label>
            <input type="tel" name="Contact_Number" value="{{ Passenger.Contact_Number }}" required><br>

            <label>Email</label>
            <input type="email" name="Email" value="{{ Passenger.Email }}" required><br>

            <button type="submit" class="btn-submit">Save Changes</button>
            <a href="{{ url_for('Passengers.Display_Passenger') }}" style="color:red">Cancel</a>
        </form>
    </div>
{% endblock %}
