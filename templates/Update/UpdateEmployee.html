{% extends 'base.html'%}
{%block title%}AFMS-Employees{%endblock%}
{% block content %}

<h1>Update Employee Details</h1>

<div>
    <form action="{{url_for('Employees.Update_Employee', id=Employee.Employee_ID)}}" method="POST">
        
        <label>Employee Name</label>
        <input type="text" name="Employee_Name" value="{{Employee.Employee_Name}}" required><br>

        <label>Email</label>
        <input type="email" name="Employee_Email"  value="{{Employee.Employee_Email}}" required ><br>

        <label>Contact Number</label>
        <input type="tel" name="Contact_Number" required value="{{Employee.Contact_Number}}"><br>

        <label>Department Name</label>
        <select name="Department_ID">
            <option value="">None</option>
            {%for Department in Department_Data%}
            <option value="{{Department.Department_ID}}"
                {{ 'selected' if Department.Department_ID == Employee.Department_ID }}
            >{{Department.Department_Name}}</option>
            {%endfor%}
        </select><br>

        <label>Role Name</label>
        <select name="Role_ID">
            <option value="">None</option>
            {%for Role in Role_Data%}
            <option value="{{Role.Role_ID}}"
                {{ 'selected' if Role.Role_ID == Employee.Role_ID }}
            >{{Role.Role_Name}}</option>
            {%endfor%}
        </select><br>

        <label>Hire Date</label>
        <input type="date" name="Hire_Date" value="{{Employee.Hire_Date}}"><br>
        
        <label>Status</label>
        <select name="Employee_Status" required>
            <option value="Active" {{ 'selected' if Employee.Employee_Status == 'Active' }}>Active</option>
            <option value="On Leave" {{ 'selected' if Employee.Employee_Status == 'On Leave' }}>On Leave</option>
            <option value="Resigned" {{ 'selected' if Employee.Employee_Status == 'Resigned' }}>Resigned</option>
        </select><br>

        <button type="submit" class="btn-submit">Save Changes</button>
        <a href="{{ url_for('Employees.Display_Employee')}}" style="color:red">Cancel</a>
        
    </form>
</div>

{%endblock%}
