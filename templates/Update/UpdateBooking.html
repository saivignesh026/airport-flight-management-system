{% extends 'base.html' %}
{% block title %}SkyDesk - Update Booking{% endblock %}
{% block content %}
    <h1>Update Booking, Check-In & Baggage (#{{ Booking.Booking_ID }})</h1>
    <div>
        <form action="{{ url_for('Bookings.Update_Booking', id=Booking.Booking_ID) }}" method="POST">
            <label>Passenger</label>
            <select name="Passenger_ID" required>
                {% for p in Passenger_Data %}
                <option value="{{ p.Passenger_ID }}" {{ 'selected' if p.Passenger_ID == Booking.Passenger_ID }}>
                    {{ p.First_Name }} {{ p.Last_Name }} ({{ p.Passport_Number }})
                </option>
                {% endfor %}
            </select><br>

            <label>Flight Schedule</label>
            <select name="Instance_ID" required>
                {% for inst in Instance_Data %}
                <option value="{{ inst.Instance_ID }}" {{ 'selected' if inst.Instance_ID == Booking.Instance_ID }}>
                    {{ inst.Flight_Number }} ({{ inst.Scheduled_Departure }})
                </option>
                {% endfor %}
            </select><br>

            <label>Seat Number</label>
            <input type="text" name="Seat_Number" maxlength="3" value="{{ Booking.Seat_Number }}" required><br>

            <label>Cabin Class</label>
            <select name="Class" required>
                {% for c in Class_Enum %}
                <option value="{{ c }}" {{ 'selected' if c == Booking.Class }}>{{ c }}</option>
                {% endfor %}
            </select><br>

            <label>Ticket Fare (₹)</label>
            <input type="number" step="0.01" min="0" name="Booking_Price" value="{{ Booking.Booking_Price }}" required><br>

            <label>Booking Status</label>
            <select name="Booking_Status" required>
                {% for st in Booking_Status_Enum %}
                <option value="{{ st }}" {{ 'selected' if st == Booking.Booking_Status }}>{{ st }}</option>
                {% endfor %}
            </select><br>

            <label>Payment Method</label>
            <select name="Payment_Method" required>
                {% for pm in Payment_Method_Enum %}
                <option value="{{ pm }}" {{ 'selected' if pm == Booking.Payment_Method }}>{{ pm }}</option>
                {% endfor %}
            </select><br>

            <label>Payment Status</label>
            <select name="Payment_Status" required>
                {% for ps in Payment_Status_Enum %}
                <option value="{{ ps }}" {{ 'selected' if ps == Booking.Payment_Status }}>{{ ps }}</option>
                {% endfor %}
            </select><br>

            <label>Transaction Ref</label>
            <input type="text" name="Transaction_Reference" value="{{ Booking.Transaction_Reference if Booking.Transaction_Reference else '' }}"><br>

            <label>Check-In Status</label>
            <select name="CheckIn_Status" required>
                {% for cs in CheckIn_Status_Enum %}
                <option value="{{ cs }}" {{ 'selected' if cs == Booking.CheckIn_Status }}>{{ cs }}</option>
                {% endfor %}
            </select><br>

            <label>Boarding Status</label>
            <select name="Boarding_Status" required>
                {% for bs in Boarding_Status_Enum %}
                <option value="{{ bs }}" {{ 'selected' if bs == Booking.Boarding_Status }}>{{ bs }}</option>
                {% endfor %}
            </select><br>

            <label>Baggage Type</label>
            <select name="Baggage_Type" required>
                {% for bt in Baggage_Type_Enum %}
                <option value="{{ bt }}" {{ 'selected' if bt == Booking.Baggage_Type }}>{{ bt }}</option>
                {% endfor %}
            </select><br>

            <label>Baggage (KG)</label>
            <input type="number" step="0.01" min="0" name="Weight_KG" value="{{ Booking.Weight_KG }}" required><br>

            <label>Baggage Status</label>
            <select name="Baggage_Status" required>
                {% for bgs in Baggage_Status_Enum %}
                <option value="{{ bgs }}" {{ 'selected' if bgs == Booking.Baggage_Status }}>{{ bgs }}</option>
                {% endfor %}
            </select><br>

            <button type="submit" class="btn-submit">Save Changes</button>
            <a href="{{ url_for('Bookings.Display_Booking') }}" style="color:red">Cancel</a>
        </form>
    </div>
{% endblock %}
