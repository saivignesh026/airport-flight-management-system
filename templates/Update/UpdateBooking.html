{% extends 'base.html' %}
{% block title %}AFMS - Edit Booking{% endblock %}
{% block content %}
<h1>Edit booking #{{ Booking.Booking_ID }}</h1>
<p>{{ Booking.Passenger_Name }} · Edit passenger details in <a href="{{ url_for('Passengers.Update_Passenger', id=Booking.Passenger_ID) }}">passenger records</a>.</p>
<form action="{{ url_for('Bookings.Update_Booking', id=Booking.Booking_ID) }}" method="POST">
    {% include 'components/booking-fields.html' %}
    <button class="btn-submit" type="submit">Save ticket</button>
    <a href="{{ url_for('Bookings.Display_Booking') }}">Back to bookings</a>
</form>
{% endblock %}
