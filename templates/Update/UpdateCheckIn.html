{% extends 'base.html' %}
{% block title %}AFMS - Update Check-in{% endblock %}
{% block content %}
<h1>Update Check-in Details</h1>
<div><form action="{{ url_for('CheckIns.Update_CheckIn', id=Booking.Booking_ID) }}" method="POST">
<p>Booking #{{ Booking.Booking_ID }} · {{ Booking.Passenger_Name }} · {{ Booking.Flight_Number }}</p>
{% include 'components/checkin-fields.html' %}
<button class="btn-submit" type="submit">Save Changes</button>
<a href="{{ url_for('CheckIns.Display_CheckIn') }}" style="color:red">Cancel</a>
</form></div>
{% endblock %}
