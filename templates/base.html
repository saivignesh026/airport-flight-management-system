<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AFMS - Airport Flight Management System{% endblock %}</title>

    <!-- Must be plain (no defer/async): sets the theme before first paint. -->
    <script src="{{ url_for('static', filename='js/theme-init.js', v=2) }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=25) }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=1) }}">
</head>
<body class="site-wrapper">
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <symbol id="icon-plane" viewBox="0 0 24 24"><path d="m2.5 19 7.2-5.2L4 8.4l1.9-1.1 8.3 4.1 4.9-3.5c1-.7 2.1-.8 2.7-.2s.5 1.7-.2 2.7l-3.5 4.9 4.1 8.3-1.1 1.9-5.4-5.7-5.2 7.2-1.3-.3 2.7-9.3-4.2-4.2-4.7 1.7z" transform="translate(0 -3) scale(.9)" fill="currentColor"/></symbol>
        <symbol id="icon-airport" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
        <symbol id="icon-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H12a4 4 0 0 0 4-4V10"/></symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
        <symbol id="icon-passenger" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></symbol>
        <symbol id="icon-ticket" viewBox="0 0 24 24"><path d="M4 6h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/><path d="M14 8v2m0 4v2"/></symbol>
        <symbol id="icon-team" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0m1-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4"/></symbol>
        <symbol id="icon-manifest" viewBox="0 0 24 24"><path d="M8 5h12M8 12h12M8 19h12"/><path d="M3 5h.01M3 12h.01M3 19h.01"/></symbol>
    </svg>
    <!-- Navbar Component -->
    {% include 'components/navbar.html' %}

    <!-- Main Page Content -->
    <main class="main-container">
        <!-- Flash Messages Block -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-container">
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="{{ 'alert' if category in ['error', 'danger'] else 'status' }}" aria-live="{{ 'assertive' if category in ['error', 'danger'] else 'polite' }}">
                  <span>{{ message }}</span>
                  <button type="button" class="alert-close" aria-label="Dismiss notification" onclick="dismissAlert(this.parentElement)">&times;</button>
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer Component -->
    {% include 'components/footer.html' %}

    <!-- Scripts. Order matters: pagination LAST. -->
    <script defer src="{{ url_for('static', filename='js/searchable-select.js', v=2) }}"></script>
    <script defer src="{{ url_for('static', filename='js/date-time-picker.js', v=3) }}"></script>
    <script defer src="{{ url_for('static', filename='js/navbar.js', v=13) }}"></script>
    <script defer src="{{ url_for('static', filename='js/table-pagination.js', v=3) }}"></script>

    <!-- Flash message auto-dismiss logic -->
    <script>
        function dismissAlert(alertEl) {
            if (!alertEl) return;
            alertEl.classList.add('fade-out');
            setTimeout(() => {
                const container = alertEl.parentElement;
                alertEl.remove();
                if (container && container.querySelectorAll('.alert').length === 0) {
                    container.remove();
                }
            }, 300);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll('.alert').forEach(alert => {
                if (alert.classList.contains('alert-error') || alert.classList.contains('alert-danger')) return;
                setTimeout(() => dismissAlert(alert), 6000);
            });
        });
    </script>
</body>
</html>
