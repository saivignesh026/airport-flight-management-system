<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AFMS - Airport Flight Management System{% endblock %}</title>

    <!-- Must be plain (no defer/async): sets the theme before first paint. -->
    <script src="{{ url_for('static', filename='js/theme-init.js', v=2) }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=22) }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=1) }}">
</head>
<body class="site-wrapper">
    <!-- Navbar Component -->
    {% include 'components/navbar.html' %}

    <!-- Main Page Content -->
    <main class="main-container">
        <!-- Flash Messages Block -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-container">
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                  <span>{{ message }}</span>
                  <button type="button" class="alert-close" onclick="dismissAlert(this.parentElement)">&times;</button>
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer Component -->
    {% include 'components/footer.html' %}

    <!-- Scripts. Order matters: pagination LAST. -->
    <script defer src="{{ url_for('static', filename='js/searchable-select.js', v=2) }}"></script>
    <script defer src="{{ url_for('static', filename='js/navbar.js', v=11) }}"></script>
    <script defer src="{{ url_for('static', filename='js/table-pagination.js', v=2) }}"></script>

    <!-- Flash message auto-dismiss logic -->
    <script>
        function dismissAlert(alertEl) {
            if (!alertEl) return;
            alertEl.classList.add('fade-out');
            setTimeout(() => {
                const container = alertEl.parentElement;
                alertEl.remove();
                if (container && container.querySelectorAll('.alert').length === 0) {
                    container.remove();
                }
            }, 300);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const alerts = document.querySelectorAll('.alert');
                alerts.forEach(alert => dismissAlert(alert));
            }, 4000);
        });
    </script>
</body>
</html>
