<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AFMS - Airport Flight Management System{% endblock %}</title>

    <!-- Must be plain (no defer/async): sets the theme before first paint.
         Bump v= whenever you change a static file so browsers refetch it. -->
    <script src="{{ url_for('static', filename='js/theme-init.js', v=2) }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=2) }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
</head>
<body class="site-wrapper">
    <!-- Navbar Component -->
    {% include 'components/navbar.html' %}

    <!-- Main Page Content -->
    <main class="main-container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer Component -->
    {% include 'components/footer.html' %}

    <!-- Scripts. Order matters: pagination LAST. -->
    <script defer src="{{ url_for('static', filename='js/searchable-select.js', v=2) }}"></script>
    <script defer src="{{ url_for('static', filename='js/navbar.js', v=2) }}"></script>
    <script defer src="{{ url_for('static', filename='js/table-pagination.js', v=2) }}"></script>
</body>
</html>
